<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOIDPULSE — Neon Arena Survival</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04050e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Visually hidden status line: screen readers announce score and state changes. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="VOIDPULSE: fly with WASD or arrow keys, aim with the mouse, hold the left mouse button to fire, dash with Shift, and release a shockwave with E when energy is full"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
